<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Anton'; src: url(../trusted-partner/fonts/anton.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-style: italic; font-weight: 300; src: url(../trusted-partner/fonts/inter-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; src: url(../trusted-partner/fonts/inter.woff2) format('woff2'); }

  :root { --teal: #3d8b91; --orange: #f2802e; --white: #ffffff; }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; background: #000; }

  #bg { position: absolute; inset: 0; }
  #bg circle { fill: none; stroke: rgba(255,255,255,0.28); stroke-width: 1.4; }

  #moon { position: absolute; left: 540px; top: 1068px; width: 190px; height: 190px; border-radius: 50%;
          background: radial-gradient(circle at 38% 35%, #ffe2b0 0%, #f6a85a 45%, #e0712a 78%, #b9561c 100%);
          box-shadow: 0 0 70px 18px rgba(242,128,46,0.33), 0 0 160px 60px rgba(242,128,46,0.12); }
  #moon i { position: absolute; border-radius: 50%; background: rgba(150,60,10,0.22); }

  .fog { position: absolute; width: 760px; height: 260px; border-radius: 50%;
         background: radial-gradient(closest-side, rgba(255,255,255,0.10), rgba(255,255,255,0)); }

  #bats { position: absolute; inset: 0; overflow: visible; }
  #bats path { fill: var(--teal); }

  #spider { position: absolute; left: 0; top: 0; overflow: visible; }

  #logo { position: absolute; left: 55px; top: 140px; width: 115px; height: 115px; }

  #kicker { position: absolute; left: 180px; top: 166px; font-family: 'Anton'; font-size: 40px; line-height: 56px;
            letter-spacing: 0.17em; color: var(--teal); white-space: nowrap; }

  #rule { position: absolute; left: 67px; top: 261px; width: 569px; height: 2px; background: #fff; transform-origin: left center; }

  #flow { position: absolute; left: 67px; top: 301px; width: 586px; }
  #headline { font-family: 'Anton'; font-size: 70px; line-height: 71px; color: var(--teal); text-transform: uppercase; }
  /* clip (not hidden) with a margin so the orange glow isn't cut into a hard box */
  .line { display: block; overflow: clip; overflow-clip-margin: 20px; height: 71px; white-space: nowrap; }
  .line > span { display: inline-block; }

  #sub { margin-top: 74px; width: 520px; font-family: 'Inter'; font-style: italic; font-weight: 300;
         font-size: 23px; line-height: 35px; color: #fff; }
  #sub.stack { font-size: 28px; line-height: 44px; }
  #sub .s { display: block; }

  #rows { margin-top: 64px; }
  .row { display: flex; align-items: center; height: 58px; border-bottom: 1px solid rgba(61,139,145,0.45); }
  .row:first-child { border-top: 1px solid rgba(61,139,145,0.45); }
  .row svg { flex: none; }
  .row span { margin-left: 18px; font-family: 'Anton'; font-size: 28px; letter-spacing: 0.08em; color: #fff; padding-top: 2px; }
  .row span em { font-style: normal; color: var(--orange); }
  .plain .row span em { color: var(--teal); }
  .plain #moon, .plain #bats, .plain #spider { display: none; }
  .plain .photo { box-shadow: 0 0 40px rgba(61,139,145,0.25); }

  #btn { position: absolute; left: 67px; top: 887px; height: 79px; }
  #btnsvg { position: absolute; left: 0; top: 0; overflow: visible; }
  #btn .inner { position: relative; display: inline-flex; align-items: center; height: 79px; padding: 0 34px 0 28px; }
  #btn .label { font-family: 'Anton'; font-size: 30px; letter-spacing: 0.077em; color: #fff; margin-left: 20px; padding-top: 2px; white-space: nowrap; }
  #btn .label em { font-style: normal; color: var(--teal); }
  #btn .label b { font-weight: normal; color: var(--orange); }

  #visit { position: absolute; left: 67px; top: 994px; font-family: 'Inter'; font-weight: 300; font-size: 20px;
           line-height: 28px; color: #fff; white-space: nowrap; }
  #visit b { font-weight: 600; color: var(--teal); }

  /* Viewfinder corners marking where contestant photos go on poll stories. */
  #frame { position: absolute; left: 67px; overflow: visible; display: none; }
  #frame path { fill: none; stroke: var(--teal); stroke-width: 3; stroke-linecap: round; }

  /* Costume photos, passed in the URL (photo= or photos=) so guests' pictures stay out of the repo. */
  .photo { position: absolute; overflow: hidden; border-radius: 16px; border: 2px solid var(--teal); background: #111;
           box-shadow: 0 0 40px rgba(242,128,46,0.18); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 10px; bottom: 10px; font-family: 'Anton'; font-size: 26px; line-height: 38px;
           color: #000; background: var(--orange); border-radius: 10px; padding: 0 12px; letter-spacing: 0.04em; }
  /* Final poll story: numbered costume list per poll, with empty room under each for its poll sticker. */
  #ballot { position: absolute; left: 67px; top: 404px; width: 586px; display: none; }
  .bsec { margin-bottom: 26px; }
  .bhead { display: flex; align-items: center; gap: 10px; font-family: 'Anton'; font-size: 24px; letter-spacing: 0.16em;
           color: var(--teal); padding-bottom: 8px; border-bottom: 1px solid rgba(61,139,145,0.45); }
  .brow { display: flex; align-items: center; height: 46px; border-bottom: 1px solid rgba(61,139,145,0.25); }
  .brow .badge { position: static; font-size: 20px; line-height: 30px; padding: 0 10px; margin-right: 16px; }
  .brow span:last-child { font-family: 'Anton'; font-size: 28px; letter-spacing: 0.06em; color: #fff; padding-top: 2px; }
  .bspace { height: 176px; }
  /* Two column version: polls side by side, prize above, one shared empty area below for both poll stickers. */
  #ballot.cols .bcols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 30px; }
  #ballot.cols .bsec { margin-bottom: 0; }
  #ballot.cols .bhead { font-size: 20px; letter-spacing: 0.1em; }
  #ballot.cols .brow { height: 44px; }
  #ballot.cols .brow .badge { font-size: 17px; line-height: 26px; padding: 0 8px; margin-right: 10px; }
  #ballot.cols .brow span:last-child { font-size: 23px; letter-spacing: 0.05em; white-space: nowrap; }
  #ballot.cols .bspace { display: none; }
  .prize { border: 1.5px solid rgba(242,128,46,0.7); border-radius: 16px; padding: 14px 20px 16px; margin-bottom: 30px;
          background: rgba(242,128,46,0.06); box-shadow: 0 0 30px rgba(242,128,46,0.12); }
  .prize .plabel { display: flex; align-items: center; gap: 10px; font-family: 'Anton'; font-size: 22px;
                   letter-spacing: 0.16em; color: var(--orange); }
  .prize .ptext { margin-top: 6px; font-family: 'Inter'; font-weight: 400; font-size: 21px; line-height: 29px; color: #fff; }

  #crownmark { position: absolute; display: none; font-family: 'Anton'; font-size: 34px; letter-spacing: 0.14em; color: var(--orange);
               text-shadow: 0 0 18px rgba(242,128,46,0.5); }
  #prizebox { position: absolute; left: 67px; width: 586px; box-sizing: border-box; display: none; }

  #bignum { position: absolute; font-family: 'Anton'; font-size: 190px; line-height: 1; color: transparent;
            -webkit-text-stroke: 2px var(--orange); display: none; }

  #tag { position: absolute; left: 67px; top: 1066px; font-family: 'Inter'; font-weight: 400; font-size: 14px;
         letter-spacing: 0.31em; color: var(--teal); opacity: 0.85; white-space: nowrap; }
</style>
</head>

      kicker: 'COSTUME CONTEST',
      lines: [[['Who wore it', 'white'], [' best?', 'orange', 'flicker']]],
      btnAfterGrid: true, noTag: true,
      button: { icon: 'arrow', html: 'POLL # \u2022 <b>VOTE BELOW</b>' },
    },
    winner: {
      kicker: 'COSTUME CONTEST',
      lines: [
        [['And the crown', 'white']],
        [['goes to\u2026', 'orange', 'flicker']],
      ],
      frame: true, btnTop: 920, noTag: true,
      button: { icon: 'crown', html: 'BEST DRESSED \u2022 <b>HALLOWEEN EDITION</b>' },
      visit: 'Thank you to everyone who dressed up and <b>voted</b>',
    },
  };

  const params = new URLSearchParams(location.search);
  const S = STORIES[params.get('story') || 'afraid'];
  const NUM = params.get('num') || '1';
  if (S === STORIES.cowinner) {
    S.lines = [[['Best dressed', 'white']], [[params.get('name') || 'Winner!', 'orange', 'flicker raw']]];
    S.button = { ...S.button, html: S.button.html.replace('#', `${params.get('part') || 1} OF ${params.get('of') || 2}`) };
  }
  if (S === STORIES.poll) {
    S.button = { ...S.button, html: S.button.html.replace('#', `${params.get('part') || 1} OF ${params.get('of') || 2}`) };
  }
  if (S === STORIES.contestant) {
    S.lines = [[['Costume', 'white'], [` No. ${NUM}`, 'orange', 'flicker']]];
    S.button = { ...S.button, html: S.button.html.replace('#', NUM) };
  }

  document.getElementById('kicker').textContent = S.kicker;

  const headline = document.getElementById('headline');
  S.lines.forEach(pieces => {
    const line = document.createElement('span'); line.className = 'line';
    const inner = document.createElement('span');
    const scale = pieces[0][3] || 1;
    if (scale !== 1) { line.style.height = `${71 * scale}px`; line.style.fontSize = `${70 * scale}px`; line.style.lineHeight = `${71 * scale}px`; }
    pieces.forEach(([text, color, fx]) => {
      const s = document.createElement('span'); s.textContent = text;
      s.dataset.color = color; if (fx) s.dataset.fx = fx;
      if (fx && fx.includes('raw')) s.style.textTransform = 'none';
      inner.appendChild(s);
    });
    line.appendChild(inner); headline.appendChild(line);
  });

  const sub = document.getElementById('sub');
  if (Array.isArray(S.sub)) {
    sub.className = 'stack';
    S.sub.forEach(t => { const s = document.createElement('span'); s.className = 's'; s.textContent = t; sub.appendChild(s); });
  } else if (S.sub) {
    const s = document.createElement('span'); s.className = 's'; s.textContent = S.sub; sub.appendChild(s);
  } else {
    sub.style.display = 'none';
  }

  const rows = document.getElementById('rows');
  (S.rows || []).forEach(r => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3d8b91" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">${ICONS[r.icon]}</svg><span>${r.html}</span>`;
    rows.appendChild(row);
  });
  if (!S.rows) rows.style.display = 'none';
  if (S.btnTop) {
    document.getElementById('btn').style.top = `${S.btnTop}px`;
    document.getElementById('visit').style.top = `${S.btnTop + 107}px`;
  }
  if (S.noTag) document.getElementById('tag').style.display = 'none';

  // Frame sits between the headline and the button; drawn once fonts settle the headline height.
  const frameSvg = document.getElementById('frame');
  let frameCorners = [];
  // Photo slots: one large photo with an outlined number, or rows of photos with number badges.
  // Each box takes its photo's own shape, so photos are only resized, never cropped.
  const photoBox = document.getElementById('photos');
  const slots = [];
  const addPhoto = (src, badge) => {
    const d = document.createElement('div'); d.className = 'photo';
    d.innerHTML = `<img src="${src}" alt="">` + (badge ? `<span class="badge">${badge}</span>` : '');
    photoBox.appendChild(d);
    slots.push({ el: d, img: d.querySelector('img') });
  };
  const place = (slot, x, y, w, h) => Object.assign(slot.el.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
  const aspect = slot => (slot.img.naturalWidth && slot.img.naturalHeight) ? slot.img.naturalWidth / slot.img.naturalHeight : 0.75;

  const single = params.get('photo');
  if (single) addPhoto(single);
  const many = params.get('photos') ? params.get('photos').split(',') : [];
  const start = +(params.get('start') || 1);
  const badges = params.get('badges') ? params.get('badges').split('|') : null;
  many.forEach((src, i) => addPhoto(src, badges ? badges[i] : `NO. ${start + i}`));

  function layoutPhotos() {
    if (single) {
      const top = S.photoTop || 398, h = S.photoH || 600, w = Math.round(h * aspect(slots[0]));
      place(slots[0], 67, top, w, h);
      const big = document.getElementById('bignum');
      big.textContent = S.bigText || NUM.padStart(2, '0');
      if (S.bigColor) big.style.webkitTextStroke = `2px var(--${S.bigColor})`;
      const fs = S.photoH ? 150 : 160;
      Object.assign(big.style, { display: 'block', left: `${67 + w + 15}px`, top: `${top + h - 156 * fs / 160}px`, fontSize: `${fs}px` });
      if (S.winnerMark) Object.assign(document.getElementById('crownmark').style, { display: 'block', left: `${67 + w + 18}px`, top: `${top + 6}px` });
    }
    if (!many.length) return;
    // Rows of up to `cols` photos share one height: the tallest that lets every row fit the 586px column.
    const cols = +(params.get('cols') || 3), gap = 14, top = S.gridTop || 398, maxH = +(params.get('maxh') || 420);
    const rows = [];
    for (let i = 0; i < slots.length; i += cols) rows.push(slots.slice(i, i + cols));
    const h = Math.floor(Math.min(maxH, ...rows.map(r => (586 - gap * (r.length - 1)) / r.reduce((a, sl) => a + aspect(sl), 0))));
    rows.forEach((r, ri) => {
      const widths = r.map(sl => Math.round(h * aspect(sl)));
      let x = 67 + (586 - (widths.reduce((a, b) => a + b, 0) + gap * (r.length - 1))) / 2;
      r.forEach((sl, k) => { place(sl, x, top + ri * (h + gap), widths[k], h); x += widths[k] + gap; });
    });
    if (S.btnAfterGrid) {
      const bottom = top + rows.length * h + (rows.length - 1) * gap;
      document.getElementById('btn').style.top = `${bottom + 30}px`;
    }
  }

  function layoutFrame() {
    if (!S.frame) return;
    const top = 301 + document.getElementById('headline').offsetHeight + 34;
    const h = (S.btnTop || 887) - 30 - top, w = 586, c = 46;
    frameSvg.style.display = 'block'; frameSvg.style.top = `${top}px`;
    frameSvg.setAttribute('width', w); frameSvg.setAttribute('height', h);
    frameSvg.innerHTML = [
      `M0 ${c}V0H${c}`, `M${w - c} 0H${w}V${c}`, `M${w} ${h - c}V${h}H${w - c}`, `M${c} ${h}H0V${h - c}`,
    ].map(d => `<path d="${d}"/>`).join('');
    frameCorners = [...frameSvg.querySelectorAll('path')];
  }

  if (S.polls) {
    const ballot = document.getElementById('ballot');
    ballot.style.display = 'block';
    let n = 1;
    const sections = S.polls.map((names, pi) => `<div class="bsec">
      <div class="bhead"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3d8b91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS.arrow}</svg>POLL ${pi + 1} ${S.twoCol ? '' : `OF ${S.polls.length} `}\u2022 VOTE BELOW</div>
      ${names.map(nm => `<div class="brow"><span class="badge">NO. ${n++}</span><span>${nm.toUpperCase().replace('80S', '80s')}</span></div>`).join('')}
      <div class="bspace"></div></div>`).join('');
    const prize = params.get('prize') || S.prize;
    const prizeHtml = S.twoCol ? `<div class="prize"><div class="plabel"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f2802e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS.trophy}</svg>THE PRIZE</div><div class="ptext" id="ptext"></div></div>` : '';
    if (S.twoCol) ballot.className = 'cols';
    ballot.innerHTML = prizeHtml + (S.twoCol ? `<div class="bcols">${sections}</div>` : sections);
    if (S.twoCol) document.getElementById('ptext').textContent = prize || 'PRIZE GOES HERE';
  }
  if (S.noButton) document.getElementById('btn').style.display = 'none';
  else {
    document.getElementById('icon').innerHTML = ICONS[S.button.icon];
    document.getElementById('btnlabel').innerHTML = S.button.html;
  }
  if (S.shift) {
    [['logo', 140], ['kicker', 166], ['rule', 261], ['flow', 301], ['ballot', 404]].forEach(([id, top]) => {
      document.getElementById(id).style.top = `${top + S.shift}px`;
    });
  }
  if (S.moonTop) document.getElementById('moon').style.top = `${S.moonTop}px`;
  if (S.plain) document.getElementById('stage').classList.add('plain');
  if (S.rowsTop) {
    const headH = S.lines.reduce((a, l) => a + 71 * (l[0][3] || 1), 0);
    document.getElementById('rows').style.marginTop = `${S.rowsTop - 301 - (S.shift || 0) - headH}px`;
  }
  if (S.visitTop) document.getElementById('visit').style.top = `${S.visitTop}px`;
  if (S.prizeTop) {
    const pb = document.getElementById('prizebox');
    Object.assign(pb.style, { display: 'block', top: `${S.prizeTop}px` });
    pb.innerHTML = `<div class="prize" style="margin:0"><div class="plabel"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f2802e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS.trophy}</svg>THE PRIZE</div><div class="ptext"></div></div>`;
    pb.querySelector('.ptext').textContent = S.prize;
  }
  document.getElementById('visit').innerHTML = S.visit || '';

  // Bats fly up out of the moon on staggered loops.
  const BAT = 'M-15 0C-13-3-10-4-7-3C-8-1-8 1-6 2C-4 0-2-1-1-3L0-1L1-3C2-1 4 0 6 2C8 1 8-1 7-3C10-4 13-3 15 0C12 0 10 2 9 5C7 3 4 3 2 5C1 4-1 4-2 5C-4 3-7 3-9 5C-10 2-12 0-15 0Z';
  const batsSvg = document.getElementById('bats');
  const BATS = [
    { start: 2.0, dur: 4.2, dx: -150, scale: 1.1, wob: 18, flap: 9 },
    { start: 2.7, dur: 5.0, dx: 60, scale: 0.8, wob: 12, flap: 11 },
    { start: 3.6, dur: 4.6, dx: -60, scale: 1.4, wob: 22, flap: 8 },
    { start: 5.2, dur: 4.4, dx: 90, scale: 0.9, wob: 15, flap: 10 },
    { start: 6.4, dur: 4.8, dx: -120, scale: 1.2, wob: 20, flap: 9 },
  ];
  BATS.forEach(b => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', BAT); batsSvg.appendChild(p); b.el = p;
  });

  function layoutButton() {
    const inner = document.getElementById('btninner');
    const label = document.getElementById('btnlabel');
    for (let size = 30; size > 20; size -= 0.5) {
      label.style.fontSize = `${size}px`;
      if (inner.offsetWidth <= 569) break;
    }
    const w = inner.offsetWidth, h = inner.offsetHeight;
    const svg = document.getElementById('btnsvg'), rect = document.getElementById('btnrect');
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    rect.setAttribute('x', 1); rect.setAttribute('y', 1);
    rect.setAttribute('width', w - 2); rect.setAttribute('height', h - 2);
    return rect.getTotalLength();
  }

  const clamp = v => Math.max(0, Math.min(1, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const elastic = p => p === 0 || p === 1 ? p : Math.pow(2, -9 * p) * Math.sin((p * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
  const mix = (a, b, p) => a.map((v, i) => Math.round(v + (b[i] - v) * p));
  const RGB = { teal: [61, 139, 145], white: [255, 255, 255], orange: [242, 128, 46] };
  // Deterministic flicker: mostly lit, with brief dips like a failing bulb.
  const flicker = t => {
    if (params.has('still')) return 1;
    const n = Math.sin(t * 37.1) * Math.sin(t * 11.3 + 1.7) * Math.sin(t * 5.9 + 0.4);
    return n > 0.42 ? 0.35 : 1;
  };

  const circles = [...document.querySelectorAll('#bg circle')];
  circles.forEach(c => { const L = 2 * Math.PI * c.r.baseVal.value; c.dataset.len = L; c.style.strokeDasharray = L; });

  window.render = function (t) {
    const btnLen = layoutButton();

    const pl = easeOut(prog(t, 0.25, 0.65));
    const logo = document.getElementById('logo');
    logo.style.opacity = pl; logo.style.transform = `scale(${0.85 + 0.15 * pl})`;

    document.getElementById('kicker').style.clipPath = `inset(0 ${100 - easeInOut(prog(t, 0.55, 1.15)) * 100}% 0 0)`;
    document.getElementById('rule').style.transform = `scaleX(${easeInOut(prog(t, 0.95, 1.45))})`;

    circles.forEach((c, i) => {
      const p = easeInOut(prog(t, 1.0 + i * 0.12, 2.2 + i * 0.12));
      c.style.strokeDashoffset = c.dataset.len * (1 - p);
    });

    // Harvest moon rises with a slow breathing glow.
    const pm = easeOut(prog(t, 0.6, 2.2));
    const moon = document.getElementById('moon');
    moon.style.opacity = pm;
    moon.style.transform = `translateY(${(1 - pm) * 70}px) scale(${1 + 0.015 * Math.sin(t * 1.6)})`;

    // Fog drifts slowly across the bottom.
    [[1, 0.7, -40, 1.0], [2, 0.5, 30, 0.8], [3, 0.6, -10, 1.0]].forEach(([i, speed, off, a]) => {
      const f = document.getElementById('fog' + i);
      f.style.left = `${-20 + off + Math.sin(t * speed + i) * 50}px`;
      f.style.opacity = a * easeOut(prog(t, 0.3, 2.0));
    });

    BATS.forEach(b => {
      const local = t - b.start;
      if (local < 0) { b.el.style.opacity = 0; return; }
      const p = (local % (b.dur + 1.5)) / b.dur;
      if (p > 1) { b.el.style.opacity = 0; return; }
      const x = 615 + b.dx * p + Math.sin(p * 9 + b.start) * b.wob;
      const y = 1150 - 1260 * easeInOut(p * 0.9 + 0.05);
      const s = b.scale * (0.5 + 0.9 * p);
      const flap = 0.35 + 0.65 * Math.abs(Math.sin(t * b.flap));
      b.el.setAttribute('transform', `translate(${x},${y}) scale(${s},${s * flap})`);
      b.el.style.opacity = 0.75 * clamp(p * 6) * clamp((1 - p) * 6);
      // In stills, keep bats out of the content column so none freeze on top of text or photos.
      if (params.has('still') && x < 680 && y > 150 && y < 1120) b.el.style.opacity = 0;
    });

    // Spider drops in on its thread, then sways.
    const pd = elastic(prog(t, 1.5, 3.0));
    const len = -30 + 320 * pd;
    document.getElementById('thread').setAttribute('y2', len);
    document.getElementById('spiderBody').setAttribute('transform', `translate(0, ${len + 8})`);
    const sway = Math.sin(t * 1.7) * 2.2 * prog(t, 2.6, 3.4);
    document.getElementById('spiderSwing').setAttribute('transform', `translate(670, 0) rotate(${sway})`);

    document.querySelectorAll('.line > span').forEach((s, i) => {
      const p = easeOut(prog(t, 1.1 + i * 0.2, 1.6 + i * 0.2));
      s.style.transform = `translateY(${(1 - p) * (s.parentElement.offsetHeight + 20)}px)`;
    });

    document.querySelectorAll('#headline [data-color]').forEach((w, i) => {
      const target = RGB[w.dataset.color];
      const p = easeInOut(prog(t, 2.0 + i * 0.12, 2.45 + i * 0.12));
      w.style.color = `rgb(${mix(RGB.teal, target, p).join(',')})`;
      if ((w.dataset.fx || '').includes('flicker')) {
        const lit = p < 1 ? p : flicker(t);
        w.style.opacity = 0.35 + 0.65 * lit;
        w.style.textShadow = `0 0 ${18 * lit}px rgba(242,128,46,${0.55 * lit})`;
      }
    });

    document.querySelectorAll('#sub .s').forEach((s, i, all) => {
      const step = all.length > 1 ? 0.35 : 0;
      const ps = easeOut(prog(t, 2.55 + i * step, 3.05 + i * step));
      s.style.opacity = ps; s.style.transform = `translateY(${(1 - ps) * 12}px)`;
    });

    document.querySelectorAll('.row').forEach((r, i) => {
      const pr = easeOut(prog(t, 2.6 + i * 0.22, 3.1 + i * 0.22));
      r.style.opacity = pr; r.style.transform = `translateX(${(1 - pr) * -16}px)`;
    });

    layoutFrame();
    layoutPhotos();
    document.querySelectorAll('.photo').forEach((ph, i) => {
      const pp = easeOut(prog(t, 2.2 + i * 0.12, 2.8 + i * 0.12));
      ph.style.opacity = pp; ph.style.transform = `translateY(${(1 - pp) * 24}px) scale(${0.96 + 0.04 * pp})`;
    });
    document.getElementById('bignum').style.opacity = easeOut(prog(t, 2.7, 3.2));
    document.getElementById('crownmark').style.opacity = easeOut(prog(t, 2.9, 3.4));
    const ppz = easeOut(prog(t, 3.2, 3.7));
    document.getElementById('prizebox').style.opacity = ppz;
    document.getElementById('prizebox').style.transform = `translateY(${(1 - ppz) * 14}px)`;
    document.querySelectorAll('.bhead, .brow').forEach((r, i) => {
      const pr = easeOut(prog(t, 2.4 + i * 0.12, 2.9 + i * 0.12));
      r.style.opacity = pr; r.style.transform = `translateX(${(1 - pr) * -16}px)`;
    });
    frameCorners.forEach((c, i) => {
      const p = easeInOut(prog(t, 2.3 + i * 0.1, 2.8 + i * 0.1));
      c.style.strokeDasharray = 2 * 46; c.style.strokeDashoffset = 2 * 46 * (1 - p);
    });

    const bStart = Array.isArray(S.sub) ? 3.5 : 3.25;
    const pb = easeInOut(prog(t, bStart, bStart + 0.65));
    const rect = document.getElementById('btnrect');
    rect.style.strokeDasharray = btnLen; rect.style.strokeDashoffset = btnLen * (1 - pb);
    document.getElementById('icon').style.opacity = easeOut(prog(t, bStart + 0.35, bStart + 0.7));
    const pt = easeOut(prog(t, bStart + 0.5, bStart + 0.85));
    const label = document.getElementById('btnlabel');
    label.style.opacity = pt; label.style.transform = `translateX(${(1 - pt) * -10}px)`;

    const pv = easeOut(prog(t, bStart + 0.8, bStart + 1.3));
    const visit = document.getElementById('visit');
    visit.style.opacity = pv; visit.style.transform = `translateY(${(1 - pv) * 10}px)`;

    document.getElementById('tag').style.opacity = 0.85 * easeOut(prog(t, bStart + 1.1, bStart + 1.6));
  };

  window.render(params.has('t') ? +params.get('t') : 9);
</script>
</body>
</html>
