<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Cormorant'; font-weight: 300 700; src: url(fonts/cormorant.woff2) format('woff2'); }
  @font-face { font-family: 'Cormorant'; font-style: italic; font-weight: 300 700; src: url(fonts/cormorant-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url(../trusted-partner/fonts/inter.woff2) format('woff2'); }

  /* Rebrand palette: deep green-black, forest, teal, cream. */
  :root { --ink: #0a1513; --forest: #0f2a26; --teal: #1f6e66; --glow: #3fa597; --cream: #efe6d5; --gold: #e0a85a; }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; }
  .dark  { background: radial-gradient(110% 70% at 75% 15%, #0c1d1a 0%, #050a09 45%, #000 100%); color: var(--cream); }
  .light { background: radial-gradient(120% 90% at 30% 30%, #f5eddf 0%, var(--cream) 60%, #e4d8c3 100%); color: var(--ink); }

  .layer { position: absolute; inset: 0; }
  .logo { position: absolute; left: 67px; top: 180px; width: 58px; height: 58px; }
  .kicker { position: absolute; left: 140px; top: 198px; font-family: 'Inter'; font-size: 13px; letter-spacing: 0.34em; }
  .dark .kicker { color: var(--glow); }
  .light .kicker { color: var(--teal); }

  .headline { position: absolute; left: 67px; font-family: 'Cormorant'; font-weight: 500; line-height: 0.92; letter-spacing: -0.01em; }
  .headline .ln { display: block; overflow: clip; overflow-clip-margin: 14px; }
  .headline .ln > span { display: inline-block; }
  .headline em { font-style: italic; }
  .light .headline em { color: var(--teal); }
  .dark .headline em { color: var(--glow); }

  .sub { position: absolute; left: 67px; font-family: 'Cormorant'; font-style: italic; font-weight: 500; }
  .caps { font-family: 'Inter'; font-size: 13px; letter-spacing: 0.3em; }
  .body { position: absolute; left: 67px; font-family: 'Inter'; font-weight: 400; font-size: 19px; line-height: 28px; }
  .dark .body { color: rgba(239,230,213,0.82); }

  /* Call to action: pill plus a small line under it. */
  .cta { position: absolute; left: 67px; }
  .pill { display: inline-flex; align-items: center; gap: 14px; height: 54px; padding: 0 28px; border-radius: 27px;
          font-family: 'Inter'; font-weight: 600; font-size: 14px; letter-spacing: 0.2em; white-space: nowrap; }
  .pill svg { flex: none; }
  .light .pill { background: var(--ink); color: var(--cream); }
  .dark .pill { border: 1.5px solid var(--glow); color: var(--cream); box-shadow: 0 0 24px rgba(63,165,151,0.25); }
  .dark .pill.solid { background: var(--cream); color: var(--ink); border-color: var(--cream); }
  .cta .note { margin-top: 14px; font-family: 'Inter'; font-size: 16px; letter-spacing: 0.04em; }
  .light .cta .note { color: var(--teal); }
  .dark .cta .note { color: var(--glow); }

  .footer { position: absolute; left: 67px; top: 1064px; font-family: 'Inter'; font-size: 11px; line-height: 16px; letter-spacing: 0.3em; opacity: 0.8; }

  /* Monday checklist */
  .todo { position: absolute; left: 67px; top: 548px; width: 586px; }
  .todo .item { display: flex; align-items: center; height: 60px; border-bottom: 1px solid rgba(10,21,19,0.15);
                font-family: 'Cormorant'; font-weight: 500; font-size: 30px; }
  .todo .box { flex: none; width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 6px; margin-right: 18px; position: relative; }
  .dark .todo .item { border-bottom-color: rgba(239,230,213,0.14); }
  .dark .todo .box { border-color: var(--cream); }
  .todo .box i { position: absolute; inset: -2px; border-radius: 6px; background: var(--teal); transform: scale(0); }
  .todo .box svg { position: absolute; left: 3px; top: 3px; }

  /* Quote blocks */
  .qmark { position: absolute; left: 60px; font-family: 'Cormorant'; font-weight: 600; font-size: 150px; line-height: 1; }
  .quote { position: absolute; left: 67px; font-family: 'Cormorant'; font-style: italic; font-weight: 500; }
  .attrib { position: absolute; left: 67px; font-family: 'Inter'; font-size: 13px; letter-spacing: 0.3em; }
  .pillars { position: absolute; left: 67px; font-family: 'Inter'; font-size: 12px; line-height: 23px; letter-spacing: 0.32em; }
  .dark .pillars { color: rgba(239,230,213,0.8); }
  .dark .qmark, .dark .attrib { color: var(--glow) !important; }
  .dark .rule { background: var(--glow) !important; }
  .rule { position: absolute; left: 67px; width: 56px; height: 2px; transform-origin: left; }
  /* Saturday prescription pad */
  .rx { position: absolute; left: 67px; top: 500px; width: 586px; box-sizing: border-box; padding: 18px 28px 22px;
        background: rgba(255,255,255,0.55); border: 1px solid rgba(31,110,102,0.3); border-radius: 18px;
        box-shadow: 0 18px 40px rgba(10,21,19,0.08); }
  .rx .head { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 10px; border-bottom: 1.5px solid rgba(31,110,102,0.35); }
  .rx .sym { font-family: 'Cormorant'; font-weight: 600; font-size: 64px; line-height: 0.9; color: var(--teal); }
  .rx .meta { font-family: 'Inter'; font-size: 11px; line-height: 18px; letter-spacing: 0.26em; text-align: right; color: var(--teal); }
  .rx .line { display: flex; gap: 14px; align-items: baseline; height: 44px; line-height: 44px; border-bottom: 1px dashed rgba(10,21,19,0.15);
              font-family: 'Cormorant'; font-style: italic; font-weight: 500; font-size: 28px; color: var(--ink); white-space: nowrap; }
  .rx .line b { font-family: 'Inter'; font-style: normal; font-weight: 600; font-size: 12px; color: var(--teal); letter-spacing: 0.1em; }
  .rx .sig { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; }
  .rx .sig .take { font-family: 'Inter'; font-size: 12px; letter-spacing: 0.2em; color: var(--teal); }
  .rx .sig .name { font-family: 'Cormorant'; font-style: italic; font-weight: 600; font-size: 30px; color: var(--ink); border-top: 1px solid rgba(10,21,19,0.4); padding-top: 2px; }
  .stamp { position: absolute; left: 430px; top: 470px; padding: 8px 16px; border: 3px solid var(--teal); border-radius: 10px;
           font-family: 'Inter'; font-weight: 700; font-size: 22px; letter-spacing: 0.2em; color: var(--teal); background: rgba(239,230,213,0.6); }

  /* Sunday week ahead */
  .week { position: absolute; left: 67px; width: 586px; }
  .week .lbl { font-family: 'Inter'; font-size: 12px; letter-spacing: 0.32em; color: var(--glow); padding-bottom: 10px; border-bottom: 1px solid rgba(63,165,151,0.4); }
  .week .day { display: flex; align-items: baseline; height: 44px; line-height: 44px; border-bottom: 1px solid rgba(239,230,213,0.1); }
  .week .day span:first-child { width: 70px; font-family: 'Inter'; font-size: 12px; letter-spacing: 0.24em; color: var(--glow); }
  .week .day span:last-child { font-family: 'Cormorant'; font-weight: 500; font-size: 28px; }
  .week .day em { font-style: italic; color: var(--glow); }
  .horizon { position: absolute; left: -100px; right: -100px; top: 860px; height: 520px; border-radius: 50%;
             background: radial-gradient(closest-side, rgba(224,168,90,0.22), rgba(63,165,151,0.10) 55%, rgba(0,0,0,0)); }
  /* Seasonal: numbered lists, a text bubble, the 11.11 mark and falling leaves */
  .nlist { position: absolute; left: 67px; width: 586px; }
  .nlist .row { display: flex; align-items: baseline; height: 50px; line-height: 50px; border-bottom: 1px solid rgba(10,21,19,0.14);
                font-family: 'Cormorant'; font-weight: 500; font-size: 29px; white-space: nowrap; }
  .dark .nlist .row { border-bottom-color: rgba(239,230,213,0.12); }
  .nlist .num { flex: none; width: 44px; font-family: 'Inter'; font-weight: 600; font-size: 12px; letter-spacing: 0.1em; color: var(--teal); }
  .dark .nlist .num { color: var(--gold); }
  .bubble { position: absolute; right: 67px; max-width: 380px; padding: 14px 20px; border-radius: 24px 24px 6px 24px;
            background: var(--teal); color: var(--cream); font-family: 'Inter'; font-size: 19px; line-height: 27px; box-shadow: 0 10px 30px rgba(10,21,19,0.15); }
  .delivered { position: absolute; right: 72px; font-family: 'Inter'; font-size: 12px; color: rgba(10,21,19,0.5); }
  .elevens { position: absolute; right: 67px; top: 790px; font-family: 'Cormorant'; font-weight: 500; font-size: 120px; line-height: 1;
             color: transparent; -webkit-text-stroke: 1.5px rgba(224,168,90,0.45); letter-spacing: -0.02em; }
  .dark .gold, .gold { color: var(--gold); }
</style>
</head>
<body>
<div id="stage"></div>

<script>
  const params = new URLSearchParams(location.search);
  const DAY = params.get('day') || 'mon';
  const stage = document.getElementById('stage');

  const ICON = {
    heart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M6 13l6 6 6-6"/></svg>',
    mail: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.6 6.6l8.4 6.4 8.4-6.4"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#efe6d5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  };

  // Shared pieces: logo + day kicker on top, serif headline, a call to action, and the footer label.
  const topRow = (kicker) => `<img class="logo" src="logo-badge.png" alt=""><div class="kicker" data-a="fade" data-t="0.4">${kicker}</div>`;
  const headline = (lines, y, size) => `<div class="headline" style="top:${y}px;font-size:${size}px">${
    lines.map((l, i) => `<span class="ln"><span data-a="rise" data-t="${0.7 + i * 0.22}">${l}</span></span>`).join('')}</div>`;
  const cta = (y, label, icon, note, solid) => `<div class="cta" style="top:${y}px">
      <div class="pill${solid ? ' solid' : ''}" data-a="pop" data-t="3.4">${label}${ICON[icon]}</div>
      ${note ? `<div class="note" data-a="fade" data-t="3.8">${note}</div>` : ''}</div>`;
  const footer = () => `<div class="footer" data-a="fade" data-t="4.1">FRIENDS OF<br>MEDICINE</div>`;

  // Quotes are swappable from the URL: &quote=...&by=...
  const quote = (fallback, by) => ({ text: params.get('quote') || fallback, by: params.get('by') || by });

  const DAYS = {
    mon: () => {
      stage.className = 'light';
      const items = ['Book your annual checkup', 'Drink more water than coffee', 'Move your body for 30 minutes',
                     'Reach out to one new connection', 'Save the date for Unwind Thursday'];
      return `
        <svg class="layer" width="720" height="1280"><defs>
          <filter id="wc"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="38"/></filter>
          <radialGradient id="tg" cx="40%" cy="40%"><stop offset="0" stop-color="#2a8378"/><stop offset="1" stop-color="#16564f"/></radialGradient></defs>
          <circle id="blob" cx="640" cy="300" r="200" fill="url(#tg)" filter="url(#wc)" opacity="0.92"/></svg>
        ${topRow('MONDAY RESET')}
        ${headline(['This Week’s', '<em>To-Do List</em>'], 290, 100)}
        <div class="todo">${items.map((t, i) => `<div class="item" data-a="slide" data-t="${1.6 + i * 0.18}">
          <span class="box"><i data-check="${3.0 + i * 0.35}"></i>${ICON.check}</span>${t}</div>`).join('')}</div>
        ${cta(912, 'JOIN THE NETWORK', 'arrow', 'friendsofmed.com/portal')}
        ${footer()}`;
    },
    tue: () => {
      stage.className = 'dark';
      return `
        <canvas id="mesh" class="layer" width="1080" height="1920" style="width:720px;height:1280px"></canvas>
        ${topRow('TECH TUESDAY')}
        ${headline(['Tech', '<em>Tuesday</em>'], 280, 128)}
        <div class="sub" style="top:540px;font-size:36px" data-a="fade" data-t="1.5">Where innovation meets care.</div>
        <div class="body" style="top:884px;width:560px" data-a="fade" data-t="2.8">Building something in health tech? We want to hear about it.</div>
        ${cta(952, 'SHARE WHAT YOU’RE BUILDING', 'mail', 'info@friendsofmed.com')}
        ${footer()}`;
    },
    wed: () => {
      stage.className = 'light';
      const q = quote('Sometimes you’ve got to set that weight down and just relax for a minute.', 'DR. ALEXA ROSE<br>PEDIATRIC NEUROSURGEON');
      return `
        <svg class="layer" width="720" height="1280"><defs>
          <filter id="wc2"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.009" numOctaves="3" seed="9"/><feDisplacementMap in="SourceGraphic" scale="70"/></filter>
          <linearGradient id="tg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a8378"/><stop offset="1" stop-color="#123f3a"/></linearGradient></defs>
          <path id="wave" d="M720 120 C600 180 470 300 520 470 C560 600 440 700 500 860 C540 980 470 1100 560 1280 L720 1280 Z" fill="url(#tg2)" filter="url(#wc2)"/></svg>
        ${topRow('WELLNESS WEDNESDAY')}
        ${headline(['Wellness', 'Wednesday'], 280, 96)}
        <div class="qmark" style="top:455px;color:var(--teal)" data-a="fade" data-t="1.6">“</div>
        <div class="quote" style="top:540px;width:400px;font-size:36px;line-height:42px" data-a="fade" data-t="1.9">${q.text}</div>
        <div class="rule" style="background:var(--teal)" data-a="draw" data-t="2.4"></div>
        <div class="attrib" style="color:var(--teal);line-height:20px" data-a="fade" data-t="2.5">${q.by}</div>
        <div class="pillars" data-a="fade" data-t="2.8">HEALTH<br>LONGEVITY<br>MENTAL HEALTH<br>PERFORMANCE</div>
        ${cta(950, 'SHARE YOUR WELLNESS TIP', 'arrow', 'Tag @friends_of_medicine')}
        ${footer()}`;
    },
    thu: () => {
      stage.className = 'dark';
      return `
        <div id="bokeh" class="layer"></div>
        ${topRow('UNWIND THURSDAY')}
        ${headline(['Unwind', '<em>Thursday</em>'], 280, 128)}
        <div class="caps" style="position:absolute;left:67px;top:540px;color:var(--glow)" data-a="fade" data-t="1.5">FORT LAUDERDALE</div>
        <div class="sub" style="top:590px;width:520px;font-size:36px;line-height:42px" data-a="fade" data-t="1.8">Good people, good drinks, and the conversations that open doors.</div>
        <div class="body" style="top:760px;width:540px" data-a="fade" data-t="2.4">Doctors, founders and friends of medicine, all in one room. Come see what the network is about.</div>
        ${cta(880, 'GET TICKETS', 'down', 'Tap the link below', true)}
        ${footer()}`;
    },
    fri: () => {
      stage.className = 'dark';
      const q = quote('In the business of healthcare, the most important hand is the one you don’t shake.', 'DR. ANDRÉ COOMBS • FOUNDER');
      return `
        <svg id="city" class="layer" width="720" height="1280"></svg>
        ${topRow('FOUNDERS FRIDAY')}
        ${headline(['Founders', '<em>Friday</em>'], 280, 128)}
        <div class="quote" style="top:530px;width:560px;font-size:36px;line-height:42px" data-a="fade" data-t="1.6">“${q.text}”</div>
        <div class="rule" style="background:var(--glow)" data-a="draw" data-t="2.2"></div>
        <div class="attrib" style="color:var(--glow);line-height:20px" data-a="fade" data-t="2.3">${q.by}</div>
        ${cta(952, 'NOMINATE A FOUNDER', 'mail', 'info@friendsofmed.com')}
        ${footer()}`;
    },
    sat: () => {
      stage.className = 'light';
      const items = ['Sleep in. No alarm.', 'Phone on do not disturb for one hour.', 'A meal you don\u2019t eat standing up.',
                     'Call someone who isn\u2019t a coworker.', 'Do one thing just because it\u2019s fun.'];
      return `
        <svg class="layer" width="720" height="1280"><defs>
          <filter id="wc3"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="11"/><feDisplacementMap in="SourceGraphic" scale="40"/></filter>
          <radialGradient id="tg3" cx="40%" cy="40%"><stop offset="0" stop-color="#2a8378"/><stop offset="1" stop-color="#16564f"/></radialGradient></defs>
          <circle id="blob" cx="660" cy="1130" r="200" fill="url(#tg3)" filter="url(#wc3)" opacity="0.92"/></svg>
        ${topRow('SATURDAY OFF-CALL')}
        ${headline(['Your Weekend', '<em>Prescription</em>'], 290, 96)}
        <div class="rx" data-a="fade" data-t="1.4">
          <div class="head"><div class="sym">\u211E</div><div class="meta">PATIENT: YOU<br>REFILLS: UNLIMITED</div></div>
          ${items.map((t, i) => `<div class="line" data-a="write" data-t="${2.0 + i * 0.4}"><b>0${i + 1}</b>${t}</div>`).join('')}
          <div class="sig"><div class="take" data-a="fade" data-t="4.1">TAKE AS NEEDED,<br>ALL WEEKEND</div><div class="name" data-a="write" data-t="4.3">Friends of Medicine</div></div>
        </div>
        <div class="stamp" data-a="stamp" data-t="4.9">OFF DUTY</div>
        ${cta(950, 'TAG WHO NEEDS THIS', 'arrow', 'Doctor\u2019s orders.')}
        ${footer()}`;
    },
    vet: () => {
      stage.className = 'dark';
      return `
        <div id="stars" class="layer"></div>
        <div class="elevens" data-a="fade" data-t="1.2">11.11</div>
        <canvas id="flag" width="480" height="270" style="position:absolute;left:60px;top:742px;width:320px;height:180px"></canvas>
        ${topRow('VETERANS DAY')}
        ${headline(['Thank you for', '<em>your service</em>'], 280, 100)}
        <div class="rule" style="top:490px;background:var(--gold)" data-a="draw" data-t="1.4"></div>
        <div class="sub" style="top:520px;width:560px;font-size:34px;line-height:40px" data-a="fade" data-t="1.6">To every veteran, and to the medics, corpsmen, nurses and physicians who served, we are grateful.</div>
        <div class="body" style="top:668px;width:540px" data-a="fade" data-t="2.3">Many of the people who care for us today first learned to heal in uniform. Today we honor them.</div>
        ${cta(950, 'THANK A VETERAN TODAY', 'heart', 'Tag a veteran in medicine')}
        ${footer()}`;
    },
    check: () => {
      stage.className = 'light';
      const items = ['Send a text that doesn’t need a reply.', 'Drop off a meal at the end of their shift.',
                     'Save them a plate, even if it’s late.', 'Ask how they’re really doing, then listen.'];
      return `
        ${topRow('HOLIDAY CHECK-IN')}
        ${headline(['Check on your', '<em>doctor friends</em>'], 290, 92)}
        <div class="sub" style="top:480px;width:560px;font-size:30px;line-height:36px" data-a="fade" data-t="1.4">The holidays are great for most of us. In the hospital, they get hectic.</div>
        <div class="bubble" style="top:580px" data-a="pop" data-t="2.0">Thinking of you on shift today. No need to text back.</div>
        <div class="delivered" style="top:672px" data-a="fade" data-t="2.5">Delivered</div>
        <div class="nlist" style="top:705px">${items.map((t, i) => `<div class="row" data-a="slide" data-t="${2.7 + i * 0.2}"><span class="num">0${i + 1}</span>${t}</div>`).join('')}</div>
        ${cta(950, 'SEND THIS TO SOMEONE ON CALL', 'arrow', 'Tag a friend in medicine')}
        ${footer()}`;
    },
    table: () => {
      stage.className = 'dark';
      const items = ['Invite them to your Thanksgiving table.', 'Plan a Friendsgiving after their shift.',
                     'Make an extra plate and drop it off.', 'Let them know they’re not alone.'];
      return `
        <div id="bokeh" class="layer"></div>
        ${topRow('NOT EVERYONE GOES HOME')}
        ${headline(['A seat at', '<em>your table</em>'], 280, 110)}
        <div class="sub" style="top:500px;width:560px;font-size:31px;line-height:38px" data-a="fade" data-t="1.5">Some of our friends in medicine are far from family, working the holiday shift, or spending it alone.</div>
        <div class="nlist" style="top:660px">${items.map((t, i) => `<div class="row" data-a="slide" data-t="${2.2 + i * 0.2}"><span class="num">0${i + 1}</span>${t}</div>`).join('')}</div>
        ${cta(950, 'INVITE SOMEONE TO YOUR TABLE', 'arrow', 'There’s a seat for you at ours.', true)}
        ${footer()}`;
    },
    gratitude: () => {
      stage.className = 'light';
      const items = ['A mentor who opened a door.', 'A colleague who covered for you.', 'A friend who reminded you to rest.'];
      return `
        <svg class="layer" width="720" height="1280"><defs>
          <filter id="wc4"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="21"/><feDisplacementMap in="SourceGraphic" scale="40"/></filter>
          <radialGradient id="tg4" cx="40%" cy="40%"><stop offset="0" stop-color="#e8b96e"/><stop offset="1" stop-color="#c98a3e"/></radialGradient></defs>
          <circle id="blob" cx="650" cy="1120" r="200" fill="url(#tg4)" filter="url(#wc4)" opacity="0.85"/></svg>
        ${topRow('GRATITUDE WEEK')}
        ${headline(['Gratitude grows', '<em>when it’s shared</em>'], 290, 86)}
        <div class="sub" style="top:480px;width:560px;font-size:36px;line-height:42px" data-a="fade" data-t="1.5">Name one person who made your year better. <span style="color:var(--teal)">Then tell them.</span></div>
        <div class="caps" style="position:absolute;left:67px;top:640px;color:var(--teal)" data-a="fade" data-t="2.0">NEED A STARTING POINT?</div>
        <div class="nlist" style="top:668px">${items.map((t, i) => `<div class="row" data-a="slide" data-t="${2.3 + i * 0.2}"><span class="num">0${i + 1}</span>${t}</div>`).join('')}</div>
        ${cta(950, 'TAG SOMEONE YOU’RE GRATEFUL FOR', 'heart', 'Gratitude means more when they hear it.')}
        ${footer()}`;
    },
    share: () => {
      stage.className = 'dark';
      const q = quote('If you experience success, you should be able to share that with others and it all comes back to you.', 'A GUEST ON MONEY AND MEDICINE');
      const items = ['Mentor someone earlier in their career.', 'Make one introduction this week.', 'Share what you learned the hard way.'];
      return `
        <div id="bokeh" class="layer"></div>
        ${topRow('PAY IT FORWARD')}
        ${headline(['Success is meant', '<em>to be shared</em>'], 280, 88)}
        <div class="quote" style="top:480px;width:560px;font-size:32px;line-height:38px" data-a="fade" data-t="1.5">“${q.text}”</div>
        <div class="rule" style="background:var(--gold)" data-a="draw" data-t="2.0"></div>
        <div class="attrib" style="color:var(--gold);line-height:20px" data-a="fade" data-t="2.1">${q.by}</div>
        <div class="nlist" style="top:700px">${items.map((t, i) => `<div class="row" data-a="slide" data-t="${2.5 + i * 0.2}"><span class="num">0${i + 1}</span>${t}</div>`).join('')}</div>
        ${cta(950, 'MAKE ONE INTRODUCTION', 'arrow', 'Tag two people who should meet.')}
        ${footer()}`;
    },
    thanks: () => {
      stage.className = 'light';
      return `
        <div id="leaves" class="layer"></div>
        ${topRow('HAPPY THANKSGIVING')}
        ${headline(['Beyond', '<em>grateful</em>'], 290, 132)}
        <div class="sub" style="top:572px;width:560px;font-size:36px;line-height:42px" data-a="fade" data-t="1.5">For the community we’ve built together, and for every life it has touched.</div>
        <div class="body" style="top:715px;width:560px;color:rgba(10,21,19,0.8)" data-a="fade" data-t="2.2">From Miami to Fort Lauderdale to Dallas, thank you for showing up, making introductions and looking out for each other. You are the reason these rooms exist.</div>
        ${cta(950, 'SEE YOU AT THE NEXT EVENT', 'arrow', 'friendsofmed.com/events')}
        ${footer()}`;
    },
    sun: () => {
      stage.className = 'dark';
      const week = [['MON', 'Your <em>To-Do List</em>'], ['TUE', 'Tech <em>Tuesday</em>'], ['WED', 'Wellness <em>Wednesday</em>'],
                    ['THU', 'Unwind <em>Thursday</em>'], ['FRI', 'Founders <em>Friday</em>']];
      return `
        <div id="stars" class="layer"></div>
        <div class="horizon" id="horizon"></div>
        ${topRow('SUNDAY RESET')}
        ${headline(['Before the week', '<em>begins</em>'], 280, 96)}
        <div class="sub" style="top:500px;width:540px;font-size:34px;line-height:40px" data-a="fade" data-t="1.5">Who made your week better? Tell them today.</div>
        <div class="week" style="top:620px">
          <div class="lbl" data-a="fade" data-t="2.1">THIS WEEK ON FRIENDS OF MEDICINE</div>
          ${week.map(([d, n], i) => `<div class="day" data-a="slide" data-t="${2.4 + i * 0.18}"><span>${d}</span><span>${n}</span></div>`).join('')}
        </div>
        ${cta(950, 'SEE UPCOMING EVENTS', 'arrow', 'friendsofmed.com/events')}
        ${footer()}`;
    },
  };
  stage.innerHTML = DAYS[DAY]();

  // Deterministic random so every render of a frame matches.
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // Thursday bokeh lights.
  const bokeh = document.getElementById('bokeh');
  const BOKEH = [];
  if (bokeh) for (let i = 0; i < 16; i++) {
    const d = document.createElement('i'), r = 30 + rnd() * 90, warm = rnd() > 0.4;
    Object.assign(d.style, { position: 'absolute', width: `${r}px`, height: `${r}px`, borderRadius: '50%', filter: `blur(${6 + rnd() * 14}px)`,
      background: warm ? 'rgba(224,168,90,0.55)' : 'rgba(63,165,151,0.5)' });
    bokeh.appendChild(d);
    BOKEH.push({ el: d, x: 200 + rnd() * 560, y: 700 + rnd() * 600, sp: 8 + rnd() * 16, ph: rnd() * 6, r });
  }

  // Thanksgiving leaves drifting down.
  const leafBox = document.getElementById('leaves');
  const LEAVES = [];
  if (leafBox) for (let i = 0; i < 14; i++) {
    const colors = ['#e0a85a', '#c2703d', '#1f6e66', '#d38b47'];
    const d = document.createElementNS('http://www.w3.org/2000/svg', 'svg'), sz = 26 + rnd() * 30;
    d.setAttribute('viewBox', '0 0 24 24'); d.setAttribute('width', sz); d.setAttribute('height', sz);
    d.innerHTML = `<path d="M12 2C7 6 4 10 5 15c1 4 4 6 7 7 3-1 6-3 7-7 1-5-2-9-7-13z" fill="${colors[i % 4]}"/><path d="M12 4v18" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>`;
    d.style.position = 'absolute'; leafBox.appendChild(d);
    LEAVES.push({ el: d, x: 380 + rnd() * 360, y0: rnd() * 1400, sp: 40 + rnd() * 50, ph: rnd() * 6, rot: rnd() * 360 });
  }

  // Sunday night stars.
  const starBox = document.getElementById('stars');
  const STARS = [];
  if (starBox) for (let i = 0; i < 60; i++) {
    const d = document.createElement('i'), r = 1 + rnd() * 2.2;
    Object.assign(d.style, { position: 'absolute', left: `${rnd() * 720}px`, top: `${rnd() * 700}px`, width: `${r}px`, height: `${r}px`,
      borderRadius: '50%', background: '#efe6d5', boxShadow: '0 0 6px rgba(239,230,213,0.8)' });
    starBox.appendChild(d); STARS.push({ el: d, ph: rnd() * 6, sp: 0.6 + rnd() * 1.6 });
  }

  // Friday skyline with lit windows and a reflection.
  const city = document.getElementById('city');
  const WINDOWS = [];
  if (city) {
    const base = 930; let x = -10; let svg = '<defs><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081614"/><stop offset="1" stop-color="#000"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(63,165,151,0)"/><stop offset="1" stop-color="rgba(63,165,151,0.18)"/></linearGradient></defs>';
    svg += `<rect x="0" y="720" width="720" height="${base - 720}" fill="url(#sky)"/>`;
    while (x < 730) {
      const w = 34 + rnd() * 46, h = 50 + rnd() * 160;
      svg += `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" fill="#0b1b18" stroke="rgba(63,165,151,0.25)" stroke-width="0.8"/>`;
      for (let wy = base - h + 10; wy < base - 8; wy += 13) for (let wx = x + 6; wx < x + w - 6; wx += 10) {
        if (rnd() > 0.72) { const id = `w${WINDOWS.length}`; WINDOWS.push({ id, ph: rnd() * 10, sp: 0.3 + rnd() });
          svg += `<rect id="${id}" x="${wx}" y="${wy}" width="4" height="6" fill="${rnd() > 0.3 ? '#e0a85a' : '#efe6d5'}"/>`; }
      }
      x += w + 2 + rnd() * 6;
    }
    svg += `<rect x="0" y="${base}" width="720" height="${1280 - base}" fill="url(#water)"/>`;
    svg += `<g id="shimmer">${Array.from({ length: 16 }, () => `<rect x="${rnd() * 700}" y="${base + 4 + rnd() * 14}" width="${20 + rnd() * 60}" height="1.5" fill="rgba(224,168,90,0.35)"/>`).join('')}</g>`;
    city.innerHTML = svg;
  }

  // Tuesday glowing mesh.
  const mesh = document.getElementById('mesh');
  function drawMesh(t) {
    const c = mesh.getContext('2d'); c.setTransform(1.5, 0, 0, 1.5, 0, 0); c.clearRect(0, 0, 720, 1280);
    const cols = 34, rows = 12, pts = [];
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      const u = k / (cols - 1), v = r / (rows - 1);
      const x = -40 + u * 800, depth = 0.55 + v * 0.45;
      const y = 610 + v * 190 - (Math.sin(u * 6 + t * 0.9) * 40 + Math.cos(u * 3.3 - t * 0.6 + v * 2) * 30 + Math.exp(-((u - 0.62) ** 2) / 0.02) * 110) * depth;
      pts.push([x, y, depth]);
    }
    const reveal = Math.min(1, Math.max(0, (t - 1.0) / 1.4));
    c.lineWidth = 0.7;
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      const p = pts[r * cols + k];
      if (k / cols > reveal) continue;
      const a = 0.08 + 0.22 * p[2];
      c.strokeStyle = `rgba(63,165,151,${a})`;
      if (k < cols - 1) { const q = pts[r * cols + k + 1]; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke(); }
      if (r < rows - 1) { const q = pts[(r + 1) * cols + k]; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke(); }
      c.fillStyle = `rgba(120,220,205,${0.25 + 0.6 * p[2]})`;
      c.shadowColor = 'rgba(63,165,151,0.9)'; c.shadowBlur = 6;
      c.beginPath(); c.arc(p[0], p[1], 1.1 + p[2] * 1.2, 0, Math.PI * 2); c.fill(); c.shadowBlur = 0;
    }
  }

  const clamp = v => Math.max(0, Math.min(1, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = p => 1 - Math.pow(1 - p, 3);

  const animated = [...document.querySelectorAll('[data-a]')];
  // The rule, attribution and pillars sit under the quote, however many lines it runs.
  function layoutQuote() {
    const q = stage.querySelector('.quote'); if (!q) return;
    let y = q.offsetTop + q.offsetHeight + 18;
    stage.querySelector('.rule').style.top = `${y}px`; y += 20;
    const a = stage.querySelector('.attrib'); a.style.top = `${y}px`; y += a.offsetHeight + 32;
    const pl = stage.querySelector('.pillars'); if (pl) pl.style.top = `${y}px`;
  }

  window.render = function (t) {
    layoutQuote();
    animated.forEach(el => {
      const s = +el.dataset.t, p = easeOut(prog(t, s, s + 0.6));
      switch (el.dataset.a) {
        case 'fade': el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 12}px)`; break;
        case 'rise': el.style.transform = `translateY(${(1 - p) * 110}%)`; break;
        case 'slide': el.style.opacity = p; el.style.transform = `translateX(${(1 - p) * -18}px)`; break;
        case 'pop': el.style.opacity = p; el.style.transform = `scale(${0.92 + 0.08 * p})`; el.style.transformOrigin = 'left center'; break;
        case 'draw': el.style.transform = `scaleX(${p})`; break;
        case 'write': el.style.clipPath = `inset(-10px ${100 - prog(t, s, s + 0.7) * 100}% -10px 0)`; break;
        case 'stamp': { const q = prog(t, s, s + 0.25); el.style.opacity = q; el.style.transform = `rotate(-12deg) scale(${1.7 - 0.7 * easeOut(q)})`; break; }
      }
    });
    const logo = stage.querySelector('.logo'); const pl = easeOut(prog(t, 0.1, 0.6));
    logo.style.opacity = pl; logo.style.transform = `scale(${0.85 + 0.15 * pl})`;

    document.querySelectorAll('[data-check]').forEach(i => {
      const p = easeOut(prog(t, +i.dataset.check, +i.dataset.check + 0.3));
      i.style.transform = `scale(${p})`; i.parentElement.querySelector('svg').style.opacity = p;
    });
    const blob = document.getElementById('blob');
    if (blob) { const p = easeOut(prog(t, 0, 1.6)); blob.setAttribute('r', 200 * (0.6 + 0.4 * p) + Math.sin(t * 0.8) * 6); blob.style.opacity = 0.92 * p; }
    const wave = document.getElementById('wave');
    if (wave) { const p = easeOut(prog(t, 0, 1.8)); wave.style.transform = `translateX(${(1 - p) * 260 + Math.sin(t * 0.6) * 8}px)`; }
    if (mesh) drawMesh(t);
    BOKEH.forEach(b => {
      const y = b.y - t * b.sp, x = b.x + Math.sin(t * 0.5 + b.ph) * 18;
      Object.assign(b.el.style, { left: `${x - b.r / 2}px`, top: `${y - b.r / 2}px`, opacity: easeOut(prog(t, 0.2, 2)) * (0.6 + 0.4 * Math.sin(t * 1.3 + b.ph)) });
    });
    // Veterans Day flag: drawn flat once, then sliced into columns that ripple like cloth.
    const flag = document.getElementById('flag');
    if (flag) {
      const fw = 285, fh = 150;
      if (!window.FLAG_SRC) {
        const src = document.createElement('canvas'); src.width = fw * 2; src.height = fh * 2;
        const g = src.getContext('2d'); g.scale(2, 2);
        for (let i = 0; i < 13; i++) { g.fillStyle = i % 2 ? '#efe6d5' : '#b0353a'; g.fillRect(0, i * fh / 13, fw, fh / 13 + 0.5); }
        const cw = fw * 0.4, ch = fh * 7 / 13;
        g.fillStyle = '#1c2b4c'; g.fillRect(0, 0, cw, ch);
        g.fillStyle = '#efe6d5';
        for (let r = 0; r < 9; r++) for (let c = 0; c < (r % 2 ? 5 : 6); c++) {
          const x = cw / 12 * (2 * c + (r % 2 ? 2 : 1)), y = ch / 10 * (r + 1), rr = 2.6;
          g.beginPath();
          for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? rr * 0.42 : rr; g.lineTo(x + rad * Math.cos(a), y + rad * Math.sin(a)); }
          g.fill();
        }
        window.FLAG_SRC = src;
      }
      const ctx = flag.getContext('2d'); ctx.setTransform(1.5, 0, 0, 1.5, 0, 0); ctx.clearRect(0, 0, 320, 180);
      const pf = easeOut(prog(t, 1.8, 2.8)); ctx.globalAlpha = pf;
      ctx.fillStyle = 'rgba(224,168,90,0.8)'; ctx.fillRect(6, 4, 4, 172);
      const cols = 57, sw = fw / cols;
      for (let i = 0; i < cols; i++) {
        const u = i / cols, amp = 7 * u + 1.5, ph = u * 7 - t * 3.2;
        const dy = Math.sin(ph) * amp, light = Math.cos(ph) * 0.18 * (0.4 + u);
        ctx.drawImage(window.FLAG_SRC, i * sw * 2, 0, sw * 2 + 1, fh * 2, 12 + i * sw, 14 + dy, sw + 0.6, fh);
        ctx.fillStyle = light > 0 ? `rgba(255,255,255,${light * 0.5})` : `rgba(0,0,0,${-light})`;
        ctx.fillRect(12 + i * sw, 14 + dy, sw + 0.6, fh);
      }
      ctx.globalAlpha = 1;
    }
    LEAVES.forEach(l => {
      const y = ((l.y0 + t * l.sp) % 1450) - 120, x = l.x + Math.sin(t * 0.9 + l.ph) * 40;
      Object.assign(l.el.style, { left: `${x}px`, top: `${y}px`, opacity: 0.7 * easeOut(prog(t, 0.2, 1.8)), transform: `rotate(${l.rot + t * 30}deg)` });
    });
    STARS.forEach(st => { st.el.style.opacity = easeOut(prog(t, 0.2, 2)) * (0.35 + 0.65 * Math.abs(Math.sin(t * st.sp + st.ph))); });
    const hz = document.getElementById('horizon');
    if (hz) { const p = easeOut(prog(t, 0, 2.5)); hz.style.opacity = p; hz.style.transform = `translateY(${(1 - p) * 60}px)`; }
    if (city) {
      const pc = easeOut(prog(t, 0.2, 2.0));
      city.style.opacity = pc;
      WINDOWS.forEach(w => { const e = document.getElementById(w.id); e.style.opacity = (Math.sin(t * w.sp + w.ph) > -0.6 ? 0.9 : 0.15) * clamp((t - 0.8 - w.ph * 0.12) * 2); });
      document.getElementById('shimmer').setAttribute('transform', `translate(${Math.sin(t * 0.7) * 10}, 0)`);
    }
  };
  window.render(params.has('t') ? +params.get('t') : 9);
</script>
</body>
</html>
